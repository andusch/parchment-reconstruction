name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      # Default groups are dev and ui. The htr group is omitted so CI
      # does not install Kraken or PyTorch and does not fetch weights.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -m "not slow"
      - run: sh scripts/check_no_tracked_cursor_logs.sh
