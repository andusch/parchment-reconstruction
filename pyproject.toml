[project]
name = "parchment-workbench"
version = "0.0.0"
description = "Local-first workbench for ranking parchment reconstruction hypotheses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
prw = "prw.cli:main"
prw-review = "prw.review_window:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prw"]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]
ui = [
    "PySide6-Essentials>=6.8",
]

[tool.uv]
default-groups = ["dev", "ui"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
packages = ["prw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests; excluded from the default CI selection",
]
