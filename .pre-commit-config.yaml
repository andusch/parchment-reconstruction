repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest -m "not slow"
        language: system
        pass_filenames: false
        types: [python]
      - id: no-tracked-cursor-logs
        name: no tracked cursor logs
        entry: sh scripts/check_no_tracked_cursor_logs.sh
        language: system
        pass_filenames: false
        always_run: true
